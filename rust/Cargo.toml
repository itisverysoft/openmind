[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
openmind-board = { path = "crates/board" }
openmind-ink = { path = "crates/ink" }
openmind-canvas = { path = "crates/canvas" }
openmind-text = { path = "crates/text" }
openmind-media = { path = "crates/media" }
openmind-media-audio = { path = "crates/media-audio" }
openmind-media-video = { path = "crates/media-video" }
openmind-engine = { path = "crates/engine" }
openmind-export = { path = "crates/export" }
egui = "=0.36.2"
eframe = "=0.36.2"
rfd = "=0.17.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
# Robust vector stack, reused by path (never copied): the crates live in the
# sibling `openmind-vector` checkout, so both repos must share one parent dir:
#   <parent>/openmind            (this repo, branch openmind-rust)
#   <parent>/openmind-vector     (itisverysoft/openmind-vector)
vectorcraft-geom = { path = "../../openmind-vector/crates/geom" }
vectorcraft-brush = { path = "../../openmind-vector/crates/brush" }
vectorcraft-color = { path = "../../openmind-vector/crates/color" }
vectorcraft-doc = { path = "../../openmind-vector/crates/doc" }
vectorcraft-render = { path = "../../openmind-vector/crates/render" }
